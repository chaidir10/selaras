<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Masuk - Selaras</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22sg%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23ff8a3d%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23f04d00%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22url(%23sg)%22%2F%3E%3Cpath%20d%3D%22M32%2011%2050%2021%2032%2031%2014%2021z%22%20fill%3D%22%23fff%22%2F%3E%3Cpath%20d%3D%22M14%2021%2032%2031V52L14%2042z%22%20fill%3D%22%23fff%22%20fill-opacity%3D%22.72%22%2F%3E%3Cpath%20d%3D%22M50%2021%2032%2031V52L50%2042z%22%20fill%3D%22%23fff%22%20fill-opacity%3D%22.48%22%2F%3E%3Ccircle%20cx%3D%2246%22%20cy%3D%2246%22%20r%3D%2211%22%20fill%3D%22%23111827%22%20stroke%3D%22%23fff%22%20stroke-width%3D%223%22%2F%3E%3Cpath%20d%3D%22M41%2046.5%2044.8%2050.3%2051.5%2042.5%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%223.2%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<style>
:root{--p:#ff5a0a;--p2:#e04e05;--p3:#ffe8dc;--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--ok:#16a34a;--warn:#d97706;--err:#dc2626;--r:14px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--p);color:#fff;transition:.15s;min-height:40px}
.btn:hover{background:var(--p2)}
.btn.sec{background:#fff;color:var(--p);border:1px solid var(--p3)}
.btn.sec:hover{background:var(--p3)}
.btn.ok{background:var(--ok)}.btn.err{background:var(--err)}.btn.ghost{background:transparent;color:var(--mu)}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px}
.btn.full{width:100%}
.btn svg.i{width:18px;height:18px}
label.f{display:block;font-size:12.5px;font-weight:600;color:#334155;margin:0 0 4px}
.in{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;background:#fff;outline:0;min-height:42px}
.in:focus{border-color:var(--p);box-shadow:0 0 0 3px #2563eb22}
textarea.in{min-height:70px}
.fg{margin-bottom:12px}
.row{display:grid;gap:12px}
@media(min-width:640px){.row.c2{grid-template-columns:1fr 1fr}.row.c3{grid-template-columns:1fr 1fr 1fr}}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 2px #0f172a0d,0 4px 14px #0f172a08;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:15px}
.muted{color:var(--mu)}
.chip{display:inline-flex;align-items:center;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.amber{background:#fff1d3;color:#8a5a00}.chip.blue{background:#e6eaf6;color:#27386b}.chip.violet{background:#f8e7dd;color:#8a3b17}.chip.cyan{background:#e7eaf0;color:#2c3a52}.chip.green{background:#e1f3e8;color:#1f6f43}.chip.red{background:#fde7e7;color:#a12a2a}.chip.gray{background:#f1f5f9;color:#475569}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#fff4ee,#fde6da 55%,#eee8fb)}
.lcard{width:100%;max-width:400px;background:#fff;border-radius:24px;padding:28px 24px;box-shadow:0 20px 50px #ff5a0a1f}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#ff8a4c,#ff5a0a);display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo.logo2{background:none;border-radius:0;width:50px;height:50px}.logo.logo2 svg{width:50px;height:50px;stroke:none;stroke-width:0}
.brand b{font-size:20px;letter-spacing:.3px;display:block}
.brand small{color:var(--mu);font-size:11.5px;line-height:1.3;display:block}
.lcard h2{font-size:18px;margin:20px 0 14px}
.demo{margin-top:16px;padding-top:14px;border-top:1px dashed var(--bd);font-size:12.5px;color:var(--mu)}
.demo button{margin:6px 6px 0 0;border:1px solid var(--p3);background:#f8fafc;color:var(--p);border-radius:99px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:12.5px}
.lfoot{text-align:center;margin-top:18px;font-size:12px;color:var(--mu)}
/* shell */
.shell{min-height:100vh}
.side{display:none}
.top{position:sticky;top:0;z-index:20;background:var(--p);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
.top .logo{width:34px;height:34px;border-radius:10px;background:#ffffff26}
.top .logo svg{width:20px;height:20px}
.top .tt{flex:1;min-width:0}.top .tt b{display:block;font-size:15px}.top .tt small{opacity:.85;font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{position:relative;background:#ffffff22;border:0;color:#fff;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;cursor:pointer}
.ib .bd{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;border-radius:99px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;font-weight:700;padding:0 4px}
.content{padding:14px;max-width:1100px;margin:0 auto;padding-bottom:90px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mu);padding:4px 10px;border-radius:10px;font-weight:600;flex:1}
.bottom a.on{color:var(--p)}
.bottom a.cta .logo{width:42px;height:42px;margin-top:-20px;box-shadow:0 6px 16px #2563eb55;border-radius:50%}
@media(min-width:900px){
 .shell{display:grid;grid-template-columns:250px 1fr}
 .side{display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;padding:18px 14px}
 .side .brand{padding:4px 6px 18px}
 .side a.n{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;font-weight:600;color:#475569;margin-bottom:3px}
 .side a.n:hover{background:#f1f5f9}.side a.n.on{background:var(--p3);color:var(--p2)}
 .side .sp{flex:1}
 .bottom{display:none}.top .logo,.top .tt small{display:none}.content{padding:22px 26px}
}
.pt{font-size:20px;font-weight:800;margin:4px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid5{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:700px){.grid5{grid-template-columns:repeat(5,1fr)}}
.stat{background:#fff;border-radius:var(--r);padding:14px;box-shadow:0 1px 2px #0f172a0d;display:block}
.stat b{font-size:26px;display:block;line-height:1.1}.stat span{color:var(--mu);font-size:12.5px;font-weight:600}
.hero{background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;border-radius:18px;padding:18px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hero h2{margin:0 0 4px;font-size:18px}.hero p{margin:0;opacity:.9;font-size:13px}
.hero .btn{background:#fff;color:var(--p2)}
.rc{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;background:#fff}
.rc:hover{border-color:var(--p);background:#f8fbff}
.rc b{display:block;font-size:13.5px;word-break:break-all}.rc span,.rc small{display:block;color:var(--mu);font-size:12.5px;margin-top:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chips a{white-space:nowrap;border:1px solid var(--bd);background:#fff;border-radius:99px;padding:6px 13px;font-weight:600;font-size:12.5px;color:#475569}
.chips a.on{background:var(--p);border-color:var(--p);color:#fff}
.sbox{position:relative;margin-bottom:10px}.sbox svg{position:absolute;left:12px;top:11px;color:var(--mu)}.sbox input{padding-left:40px}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
/* stepper */
.steps{display:flex;margin:6px 0 4px}
.stp{flex:1;text-align:center;position:relative;font-size:11px;color:var(--mu);font-weight:600}
.stp i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#e2e8f0;margin:0 auto 5px;font-style:normal;font-size:12px;position:relative;z-index:1;color:#64748b}
.stp:not(:last-child):after{content:"";position:absolute;top:12px;left:50%;width:100%;height:3px;background:#e2e8f0}
.stp.done i,.stp.cur i{background:var(--p);color:#fff}.stp.done:not(:last-child):after{background:var(--p)}.stp.cur{color:var(--p)}
.stp.rej i{background:var(--err);color:#fff}
.tl{border-left:2px solid var(--bd);margin-left:6px;padding-left:14px}
.tl div{position:relative;margin-bottom:12px}.tl div:before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--p)}
.tl small{color:var(--mu);display:block}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.tabs button{border:1px solid var(--bd);background:#fff;border-radius:10px;padding:7px 14px;font-weight:700;cursor:pointer;color:#475569}.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);font-size:13px;vertical-align:middle}.tbl th{color:var(--mu);font-size:12px}
.itm{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px;background:#fcfdff}
.itm .row{margin-bottom:8px}
.itm .ir{display:grid;grid-template-columns:minmax(0,2fr) 92px 100px minmax(0,2fr);gap:10px;align-items:end}.itm .ir .in{min-width:0}
@media(max-width:899px){.itm .ir{grid-template-columns:minmax(0,1fr) 92px 100px}.itm .irn{grid-column:1/-1}.itm .irk{grid-column:1/-1}}
.pvwrap{background:#e2e8f0;border-radius:12px;padding:10px;overflow:hidden}
.pvw{width:100%;overflow:hidden;margin-bottom:10px}.pvi{width:max-content}
.two{display:grid;gap:14px}
@media(min-width:1000px){.two.new{grid-template-columns:minmax(380px,1fr) minmax(380px,520px);align-items:start}}
#toastBox{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;max-width:90vw}
.toast{background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;animation:toastIn .22s var(--ease) both}
.toast.out{animation:toastOut .2s ease-in forwards}
.mback{position:fixed;inset:0;background:#0f172a88;z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .16s ease-out both}
@media(min-width:640px){.mback{align-items:center}}
.mbox{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px;animation:sheet .24s var(--ease) both}
.mback.out{animation:fadeOut .15s ease-in forwards;pointer-events:none}
.mback.out .mbox{animation:sheetOut .15s ease-in forwards}
@media(min-width:640px){.mbox{border-radius:18px}}
.mbox h3{margin:0 0 12px}.mbox .act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.hint{font-size:12px;color:var(--mu);margin-top:4px}
.sigp{max-height:70px;border:1px dashed var(--bd);border-radius:8px;padding:4px;background:#fff}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
/* ===== KATALOG ===== */
body.katbody{background:linear-gradient(135deg,#fdf0ea 0%,#eef3ff 55%,#f4effd 100%) fixed}
.kat{--ac:#ff5a0a;--ink:#111827;padding:0}
.kframe{background:#fff;min-height:100vh;padding:28px clamp(20px,3vw,48px) 44px clamp(10px,1.2vw,18px)}
.kgrid{display:grid;grid-template-columns:210px minmax(0,1fr);gap:clamp(24px,3vw,44px)}
.kside{position:sticky;top:28px;align-self:start;max-height:calc(100vh - 56px);overflow:auto}
.kmain{min-width:0}
.kside .kc.kout{color:var(--mu);margin-top:6px}
.kuser{font-size:12.5px}
.kuser b{display:block;color:var(--ink)}
.kcards.tiles{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.kcards.tiles .kcard{min-height:180px}
.kpill{border:0;background:#f3f4f6;border-radius:99px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.kpill svg{width:14px;height:14px}
.kreqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.kat .rc{background:#f6f7fb;border:0;border-radius:18px;padding:16px;margin:0}
.kat .rc:hover{background:#fff1ea}
.kat .card{background:#f6f7fb;box-shadow:none;border-radius:20px;padding:20px}
.kat .pt{font-size:22px;letter-spacing:-.3px}
.kat .tabs button,.kat .chips a{background:#fff}
.kat .tabs button.on,.kat .chips a.on{background:var(--p)}
.kside{align-self:start;position:sticky;top:28px;display:flex;flex-direction:column;background:none;border-radius:0;padding:0}
.kbrand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px;margin-bottom:2px;border-bottom:1px solid #e5e7ee}
.kbrand b{display:block;font-size:14px;font-weight:800;letter-spacing:-.2px;color:var(--ink);line-height:1.15}
.kbrand small{display:block;font-size:11px;color:var(--mu);font-weight:600;margin-top:2px}
.kside .kmark{width:34px;height:34px;margin:0;flex:none}
.kside h2{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:#94a3b8;margin:8px 12px 6px}
.kside .kl{display:flex;flex-direction:column;gap:2px}
.kside .kc{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:none;padding:9px 12px;margin:0;border-radius:14px;font:inherit;font-size:13px;font-weight:600;color:#475569;cursor:pointer;line-height:1.3;text-decoration:none;transition:background .18s,color .18s,box-shadow .18s}
.kside .kc svg.i{width:20px;height:20px;stroke-width:1.7;color:#94a3b8;transition:color .18s}
.kside .kc:hover{background:#f3f4f8;color:var(--ink)}
.kside .kc:hover svg.i{color:var(--ac)}
.kside .kc.on{background:var(--ac);color:#fff;font-weight:700;box-shadow:0 4px 12px -2px #ff5a0a33}
.kside .kc.on svg.i{color:#fff}
.kside .kc:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.kside .kc.kout{color:#b91c1c;margin-top:4px}
.kside .kc.kout:hover{background:#fee2e2;color:#b91c1c}
.kside .kc.kout svg.i{color:#ef4444}
.kuser{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px;background:#f6f7fb;border-radius:16px;border:0}
.kuser .kav{width:38px;height:38px;font-size:13px}
.kuser>div{min-width:0}
.kuser b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.kuser .chip{font-size:10.5px;padding:2px 8px}
.kside .kback{margin-top:8px;background:#fff;color:var(--ink)}
.ktop{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.ksearch{flex:1;position:relative;min-width:0}
.ksearch input{width:100%;height:46px;border-radius:99px;border:0;background:#f3f4f6;padding:0 18px 0 44px;font-size:13px;outline:0}
.ksearch input:focus{box-shadow:0 0 0 3px #ff5a0a22}
.ksearch svg{position:absolute;left:16px;top:14px;width:18px;height:18px;color:#111}
.kib{width:46px;height:46px;border-radius:50%;border:0;background:#f3f4f6;display:grid;place-items:center;cursor:pointer;position:relative;color:#111;flex:none}
.kib.sq{border-radius:14px}
.kib .kbg{position:absolute;top:-4px;right:-4px;background:var(--ac);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
.kav{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#fbd5c0,#f6b79a);display:grid;place-items:center;font-weight:800;color:#7c2d12;flex:none}
.kbackm{display:none}
.khero{display:grid;grid-template-columns:1.9fr 1fr;gap:16px;margin-bottom:26px}
.kban{border-radius:20px;background:linear-gradient(115deg,#fbe9df 0%,#eaeefc 62%,#e0e8fb 100%);min-height:260px;padding:34px 36px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.kban h1{font-size:40px;line-height:1;margin:0 0 12px;font-weight:900;letter-spacing:-1px;color:var(--ink)}
.kban p{margin:0 0 22px;font-size:12px;color:#8190b5;line-height:1.5;font-weight:600}
.kban .kart{position:absolute;right:20px;top:50%;transform:translateY(-50%)}
.kbtn{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;border:0;border-radius:99px;background:var(--ac);color:#fff;font-weight:700;padding:12px 30px;font-size:13px;cursor:pointer;position:relative;z-index:1}
.kbtn.dk{background:#1f2937;padding:9px 20px;font-size:12px}
.kbtn svg{width:16px;height:16px}
.kside2{display:grid;gap:16px;grid-template-rows:1fr 1fr}
.kmini{border-radius:20px;padding:20px 22px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.kmini.a{background:linear-gradient(110deg,#fbe4d8,#e8edfb);text-align:center;align-items:center}
.kmini.a h4{font-size:18px;line-height:1.3;margin:0;font-weight:800;color:var(--ink)}
.kmini.a h4 b{color:var(--ac)}
.kmini.a small{margin-top:6px;color:#8190b5;font-weight:600;font-size:11.5px}
.kmini.b{background:linear-gradient(110deg,#e9eefc,#e2ebfb)}
.kmini.b h4{margin:0 0 4px;font-size:15px;font-weight:800;color:var(--ink)}
.kmini.b small{color:#8190b5;font-weight:600;font-size:11.5px;display:block;margin-bottom:12px}
.kmini.b .kart{position:absolute;right:12px;top:12px;width:98px;height:98px}
.ksec{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px;gap:10px;flex-wrap:wrap}
.ksec h3{margin:0;font-size:14.5px;font-weight:800;color:var(--ink)}
.ksec button{border:0;background:#f3f4f6;border-radius:99px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:center}
.ksec button svg{width:14px;height:14px}
.kcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-bottom:28px}
.kcard{border-radius:20px;padding:16px 14px;position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:200px}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* ===== HAK AKSES ===== */
.vonly{display:flex;align-items:center;gap:8px;margin-top:10px;background:#fef3c7;color:#92400e;border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:600}
.vonly svg{width:16px;height:16px;flex:none}
.krole{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;background:#f6f7fb;border-radius:16px;padding:12px 16px;margin-bottom:22px;font-size:12.5px;color:#475569}
.krole span:nth-child(2){flex:1;min-width:200px}.krole a{color:var(--p);font-weight:700}
.kroles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:16px}
.krc{background:#f6f7fb;border-radius:18px;padding:16px;border:2px solid transparent;transition:border-color .2s,transform .2s var(--ease)}
.krc.me{border-color:var(--p);background:#fff7f2}
.krc p{margin:10px 0 6px;font-size:12.5px;line-height:1.5;color:#475569}.krc small{color:var(--p);font-weight:700}
.tbl.mx{min-width:640px}.tbl.mx th.me,.tbl.mx td.me{background:#fff7f2}
.tbl.mx tr.grp td{background:#f6f7fb;font-weight:800;font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;color:#64748b}
/* ===== SURAT ===== */
#printArea{position:fixed;left:-99999px;top:0}
.paper{width:210mm;min-height:297mm;background:#fff;color:#000;padding:15mm 25mm 15mm;font:11pt/1.5 Arial,Helvetica,sans-serif;box-shadow:0 2px 10px #0003;position:relative}
.paper .kop{display:block;width:180mm;margin-left:-14mm;height:auto}
.paper .c{text-align:center}.paper .h{font-size:11pt}
.paper p{margin:0 0 12pt}.paper .j{text-align:justify}.paper .ind{text-indent:12mm}
.paper table{border-collapse:collapse}
.paper .kv td{padding:1.2mm 0;vertical-align:top}
.paper .hr{border-top:2.2px solid #000;margin:6mm 0 7mm}
.paper .sign{margin-top:12mm;width:58mm;text-align:center}.paper .sign .sig{height:24mm;max-width:100%;width:auto;object-fit:contain;display:block;margin:0 auto -3mm;position:relative}.paper .sigsp{height:24mm}
.paper .sigw{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:30mm;min-height:28mm}
.paper .sigw .sig{margin:0}
.paper .sigw .cap{position:absolute;right:calc(100% - 19mm);top:50%;transform:translateY(-50%);width:38mm;height:38mm;object-fit:contain;mix-blend-mode:multiply;opacity:.92;pointer-events:none;z-index:2}
.paper .c .sig{height:24mm;max-width:58mm;width:auto;object-fit:contain;display:block;margin:0 auto -3mm;position:relative}
.paper td .sig{height:22mm;max-width:58mm;width:auto;object-fit:contain;display:block;margin:1mm 0 -3mm;position:relative}
.paper .sign div,.paper td b{position:relative}
.paper table.grid{width:100%}
.paper table.grid th,.paper table.grid td{border:1px solid #000;padding:1.6mm 2mm;font-size:11pt;line-height:1.35}
.paper table.grid th{font-weight:700;text-align:center}
.paper .times{font-family:"Times New Roman",Times,serif}
@media print{
 @page{size:A4;margin:0}
 body>*:not(#printArea){display:none!important}
 body{background:#fff}
 #printArea{position:static;left:auto}
 .paper{box-shadow:none;margin:0;min-height:296.4mm;page-break-after:always;break-after:page}
 .paper:last-child{page-break-after:auto}
}
</style>

 if(n<2000)return 'seribu'+(n%1000?' '+terbilang(n%1000):'');
 return terbilang(Math.floor(n/1000))+' ribu'+(n%1000?' '+terbilang(n%1000):'')}

/* potong tepi kosong pada gambar tanda tangan agar ukurannya proporsional */
function trimImg(src){return new Promise(res=>{const im=new Image();im.onerror=()=>res(src);im.onload=()=>{
 const w=im.width,h=im.height,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0);
 let d;try{d=x.getImageData(0,0,w,h).data}catch(e){return res(src)}
 let x0=w,y0=h,x1=-1,y1=-1;
 for(let y=0;y<h;y++)for(let i=0;i<w;i++){const k=(y*w+i)*4;if(d[k+3]>24&&(d[k]+d[k+1]+d[k+2])/3<235){if(i<x0)x0=i;if(i>x1)x1=i;if(y<y0)y0=y;if(y>y1)y1=y}}
 if(x1<0)return res(src);
 const p=Math.round(Math.max(w,h)*.012)+2;x0=Math.max(0,x0-p);y0=Math.max(0,y0-p);x1=Math.min(w-1,x1+p);y1=Math.min(h-1,y1+p);
 const cw=x1-x0+1,ch=y1-y0+1;if(cw>=w*.96&&ch>=h*.96)return res(src);
 const o=document.createElement('canvas');o.width=cw;o.height=ch;o.getContext('2d').drawImage(c,x0,y0,cw,ch,0,0,cw,ch);res(o.toDataURL('image/png'))};im.src=src})}

/* hapus latar putih/kertas pada tanda tangan & cap agar transparan (color-to-alpha) */
function clearBg(src){return new Promise(res=>{const im=new Image();im.onerror=()=>res(src);im.onload=()=>{
 const w=im.width,h=im.height,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0);
 let id;try{id=x.getImageData(0,0,w,h)}catch(e){return res(src)}
 const d=id.data;let tr=0;for(let k=3;k<d.length;k+=4)if(d[k]<200)tr++;
 if(tr>w*h*.05)return res(src);
 let br=0,bg=0,bb=0,bc=0;const add=(i,j)=>{const k=(j*w+i)*4;if(Math.min(d[k],d[k+1],d[k+2])>120){br+=d[k];bg+=d[k+1];bb+=d[k+2];bc++}};
 for(let i=0;i<w;i+=2){add(i,0);add(i,h-1)}for(let j=0;j<h;j+=2){add(0,j);add(w-1,j)}
 if(!bc)return res(src);br/=bc;bg/=bc;bb/=bc;
 for(let k=0;k<d.length;k+=4){
  const nr=Math.min(1,d[k]/br),ng=Math.min(1,d[k+1]/bg),nb=Math.min(1,d[k+2]/bb),mn=Math.min(nr,ng,nb),ar=1-mn;
  if(ar<.005){d[k+3]=0;continue}
  /* alpha linear (tanpa penguatan) + warna dipulihkan -> tampilan di atas putih sama persis dengan aslinya */
  let a=(ar-.05)/.95;a=a<0?0:a>1?1:a;if(a<=0){d[k+3]=0;continue}
  const inv=1-a,cl=v=>Math.max(0,Math.min(255,Math.round(v*255)));
  d[k]=cl((nr-inv)/a);d[k+1]=cl((ng-inv)/a);d[k+2]=cl((nb-inv)/a);d[k+3]=Math.round(a*255)}
 x.putImageData(id,0,0);res(c.toDataURL('image/png'))};im.src=src})}
const prepSig=async src=>trimImg(await clearBg(src));

async function imgFromUrl(u){const r=await fetch(u,{signal:AbortSignal.timeout(9000)});if(!r.ok)throw new Error('http');const b=await r.blob();if(!b.type.startsWith('image/'))throw new Error('type');return readImg(b,700,.78)}
const FOTO_EN={kamera:'camera',kursi:'chair',meja:'desk',lemari:'cabinet',sepeda:'bicycle',motor:'motorcycle',mobil:'car',masker:'mask',sarung:'glove',tangan:'glove',vaksin:'vaccine',alkohol:'alcohol',kertas:'paper',tinta:'ink',timbangan:'scale',pendingin:'cooler',termometer:'thermometer',gunting:'scissors',plester:'plaster',spidol:'marker',pensil:'pencil',bolpoin:'pen',pulpen:'pen',komputer:'computer',monitor:'monitor',proyektor:'projector',telepon:'telephone',kipas:'fan',jarum:'needle'};
const fNorm=w=>[...String(w).toLowerCase()].filter(c=>(c>='a'&&c<='z')||(c>='0'&&c<='9')).join('');
const fHasNum=t=>[...t].some(c=>c>='0'&&c<='9');
async function fotoCands(q){
 const toks=q.split(' ').map(fNorm).filter(Boolean);if(!toks.length)return [];
 const en=t=>FOTO_EN[t]||t,model=toks.filter(fHasNum);
 const ok=title=>{const n=fNorm(title),has=t=>n.includes(t)||n.includes(en(t));if(!model.every(has))return 0;const sc=toks.filter(has).length/toks.length;return sc>=.6?sc:0};
 const wpc=[],cm=[],ov=[],qs=[...new Set([toks.map(en).join(' '),q.trim()])];
 /* prioritas: foto utama (infobox) artikel Wikipedia = foto produk bersih; baru foto Commons & Openverse */
 const wp=async(lang,qq)=>{try{const r=await fetch('https://'+lang+'.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=10&gsrsearch='+encodeURIComponent(qq)+'&prop=pageimages&piprop=thumbnail&pithumbsize=700',{signal:AbortSignal.timeout(9000)});
   const j=await r.json();Object.values((j.query&&j.query.pages)||{}).forEach(p=>{const sc=ok(p.title||'');if(sc&&p.thumbnail&&p.thumbnail.source)wpc.push({sc,ix:p.index||99,u:p.thumbnail.source})})}catch(e){}};
 await Promise.all([wp('en',qs[0]),wp('id',q.trim()),...(qs[1]?[wp('en',qs[1])]:[])]);
 for(const qq of qs){
  try{const r=await fetch('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=20&gsrsearch='+encodeURIComponent(qq)+'&prop=imageinfo&iiprop=url%7Cmime&iiurlwidth=700',{signal:AbortSignal.timeout(9000)});
   const j=await r.json();Object.values((j.query&&j.query.pages)||{}).forEach(p=>{const ii=p.imageinfo&&p.imageinfo[0],sc=ok((p.title||'').replace('File:',''));if(sc&&ii&&['image/jpeg','image/png'].includes(ii.mime))cm.push({sc,ix:p.index||99,u:ii.thumburl||ii.url})})}catch(e){}
 }
 try{const r=await fetch('https://api.openverse.org/v1/images/?page_size=20&mature=false&q='+encodeURIComponent(qs[0]),{signal:AbortSignal.timeout(9000)});const j=await r.json();
  (j.results||[]).forEach(it=>{const sc=ok((it.title||'')+' '+((it.tags||[]).map(t=>t.name).join(' ')));if(sc)ov.push({sc,ix:99,u:it.thumbnail||it.url})})}catch(e){}
 const srt=L=>L.sort((x,y)=>y.sc-x.sc||x.ix-y.ix);
 return [...new Set([...srt(wpc),...srt(cm),...srt(ov)].map(c=>c.u))].filter(u=>!u.toLowerCase().includes('logo'))}
async function webFoto(q){const L=await fotoCands(q);for(const u of L.slice(0,5)){try{return await imgFromUrl(u)}catch(e){}}return ''}
function autoFoto(m){const q=(m.nama||'').trim();if(!q||m.fotoQ===q)return;m.fotoQ=q;toast('Mencari foto "'+q+'" di internet…');

function readImg(file,max=1100,q=.75,png=false){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const w=Math.round(im.width*s),h=Math.round(im.height*s);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');if(!png){x.fillStyle='#fff';x.fillRect(0,0,w,h)}x.drawImage(im,0,0,w,h);res(c.toDataURL(png?'image/png':'image/jpeg',q))};im.src=fr.result};fr.readAsDataURL(file)})}

function listItems(u){
 const q=ui.q.toLowerCase(),f=ffOf('req');

  &&(!q||(r.noND+r.unit+r.items.map(i=>i.nama).join(' ')).toLowerCase().includes(q))
  &&(!f.from||r.tanggal>=f.from)&&(!f.to||r.tanggal<=f.to)
  &&(f.unit==='all'||r.unit===f.unit)
  &&(f.jenis==='all'||r.items.some(i=>i.jenis===f.jenis)));
 if(f.sort==='lama')L=[...L].reverse();
 else if(f.sort==='tgl-desc')L=[...L].sort((a,b)=>b.tanggal.localeCompare(a.tanggal));
 else if(f.sort==='tgl-asc')L=[...L].sort((a,b)=>a.tanggal.localeCompare(b.tanggal));
 return L}

 DB.reqs.filter(r=>r.status==='selesai'&&(u.role!=='pj'||r.pjId===u.id)).forEach(r=>r.items.forEach(it=>{
  const q=+(it.diberikan!==undefined&&it.diberikan!==null&&it.diberikan!==''?it.diberikan:it.jumlah)||0;if(!q)return;

function flyToCart(from){
 const cart=$('.ktop [data-act=kcart]');if(!cart||!from||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const src=from.querySelector('img,svg');if(!src)return;
 const a=from.getBoundingClientRect(),b=cart.getBoundingClientRect(),S=68;
 const el=document.createElement('div');el.className='fly';el.style.cssText='left:'+(a.left+a.width/2-S/2)+'px;top:'+(a.top+a.height/2-S/2)+'px;width:'+S+'px;height:'+S+'px';
 el.appendChild(src.cloneNode(true));document.body.appendChild(el);
 const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2);
 const an=el.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+dx*.45+'px,'+(dy*.45-70)+'px) scale(.75)',opacity:1,offset:.45},{transform:'translate('+dx+'px,'+dy+'px) scale(.22)',opacity:.35}],{duration:720,easing:'cubic-bezier(.45,.05,.55,.95)'});

function lightbox(list,i){
 if(!list.length)return;
 const w=document.createElement('div');w.className='lbx';
 w.innerHTML='<img alt="">'+(list.length>1?'<button type="button" class="lbn prev" aria-label="Sebelumnya">'+ic('back')+'</button><button type="button" class="lbn next" aria-label="Berikutnya">'+ic('next')+'</button>':'')+'<button type="button" class="lbc" aria-label="Tutup">'+ic('x')+'</button><span class="lbi"></span>';
 const img=w.querySelector('img'),cnt=w.querySelector('.lbi');
 const show=n=>{i=(n+list.length)%list.length;img.classList.remove('in');void img.offsetWidth;img.src=list[i];img.classList.add('in');cnt.textContent=list.length>1?(i+1)+' / '+list.length:''};
 const close=()=>{document.removeEventListener('keydown',kd,true);w.classList.add('out');setTimeout(()=>w.remove(),160)};
 const kd=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close()}else if(e.key==='ArrowLeft')show(i-1);else if(e.key==='ArrowRight')show(i+1)};
 w.onclick=e=>{if(e.target.closest('.prev'))show(i-1);else if(e.target.closest('.next'))show(i+1);else if(e.target.closest('.lbc')||e.target===w)close()};
 let x0=null;w.ontouchstart=e=>{x0=e.touches[0].clientX};w.ontouchend=e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50)show(i+(dx<0?1:-1))};

 closePop();el.classList.add('cs-pop');el.style.visibility='hidden';document.body.appendChild(el);
 const r=btn.getBoundingClientRect(),w=el.classList.contains('cal')?288:el.dataset.w?+el.dataset.w:Math.max(r.width,160);

 const room=innerHeight-r.bottom-14,h=el.scrollHeight+2;
 if(h>room&&r.top>room){el.style.maxHeight=Math.min(h,r.top-14)+'px';el.style.top=Math.max(8,r.top-Math.min(h,r.top-14)-6)+'px'}
 else{el.style.maxHeight=Math.max(120,room)+'px';el.style.top=(r.bottom+6)+'px'}

const CS_SEL='select.in:not([data-cs]),input[type=date]:not([data-cs]),input[list]:not([data-cs])';
function enhAll(){document.querySelectorAll(CS_SEL).forEach(el=>el.matches('select')?enhSelect(el):el.type==='date'?enhDate(el):enhCombo(el));if(POP&&!POP.btn.isConnected)closePop()}
new MutationObserver(ms=>{if(ms.some(m=>m.addedNodes.length||m.removedNodes.length))enhAll()}).observe(document.body,{childList:true,subtree:true});
render();
enhAll();
const SPLASH_HTML=(document.getElementById('splash')||{}).innerHTML||'';
function hideSplash(){const e=document.getElementById('splash');if(!e)return;e.classList.add('out');setTimeout(()=>{if(e.classList.contains('out'))e.remove()},420)}
const SPLASH_MSG=['Menyiapkan data…','Memeriksa stok barang…','Menyelaraskan aset…','Hampir selesai…'];let _spi=0;
setInterval(()=>{const e=document.querySelector('#splash .sp-msg');if(!e)return;_spi=(_spi+1)%SPLASH_MSG.length;e.textContent=SPLASH_MSG[_spi];e.style.animation='none';void e.offsetWidth;e.style.animation=''},1100);
function showSplash(ms){let e=document.getElementById('splash');if(!e){e=document.createElement('div');e.id='splash';e.setAttribute('role','status');e.innerHTML=SPLASH_HTML;document.body.appendChild(e)}else e.classList.remove('out');setTimeout(hideSplash,ms)}
{const go=()=>setTimeout(hideSplash,Math.max(0,1500-performance.now()));if(document.readyState==='complete')go();else addEventListener('load',go)}
(async()=>{let ch=0;const tc=new Map();
 const fix=async(o,k='ttd',fl='ttdB')=>{if(o&&o[k]&&!o[fl]){const key=k+'|'+o[k];if(!tc.has(key))tc.set(key,await prepSig(o[k]));o[k]=tc.get(key);o[fl]=1;ch=1}};
 for(const u of DB.users)await fix(u);await fix(DB.settings.kpb);await fix(DB.settings.kpb,'cap','capB');
 for(const r of DB.reqs){await fix(r.pj);await fix(r.sbbk&&r.sbbk.petugas)}
 if(ch){save();render(true)}})();
